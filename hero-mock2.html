<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Mock 2 — 行銷人物插畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Inter',sans-serif;color:#1E293B;line-height:1.5;background:#f5f5f5;display:flex;justify-content:center;padding:20px 0}
.phone-frame{width:390px;background:linear-gradient(160deg,#fff 50%,#FFF0F5 100%);min-height:100vh;position:relative;overflow:hidden}

.hero{padding:60px 20px 32px;position:relative}
.badge{display:inline-block;font-size:12px;font-weight:600;color:#FF6B9D;background:rgba(255,107,157,0.1);padding:4px 12px;border-radius:20px;margin-bottom:16px}
.hero-title{font-size:28px;line-height:38px;font-weight:700;color:#1A1A5E;margin-bottom:20px}
.hero-title span{color:#FF6B9D}

.bullet-section{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center;margin-bottom:24px}
.bullets{list-style:none}
.bullets li{font-size:14px;color:#1A1A5E;margin-bottom:8px;font-weight:500;line-height:1.4}

/* 人物插畫 */
.person-illust{position:relative;display:flex;align-items:center;justify-content:center;height:150px}
.person{font-size:64px;position:relative;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.1))}
.person-bg{position:absolute;width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,rgba(255,107,157,0.15),rgba(245,166,35,0.1));top:50%;left:50%;transform:translate(-50%,-50%)}
.float-icon{position:absolute;font-size:18px;opacity:0.7}
.float-icon:nth-child(3){top:5px;right:5px;font-size:16px}
.float-icon:nth-child(4){bottom:15px;left:0;font-size:20px}
.float-icon:nth-child(5){top:25px;left:5px;font-size:14px}
.float-icon:nth-child(6){bottom:5px;right:10px;font-size:16px}

/* 裝飾小標籤 */
.mini-tag{position:absolute;background:#fff;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.1);white-space:nowrap;z-index:3}
.tag-1{top:8px;left:-5px;color:#22C55E}
.tag-2{bottom:20px;right:-5px;color:#FF6B9D}

.search-box{display:flex;gap:0;margin-bottom:12px}
.search-box input{flex:1;padding:14px 16px;border:2px solid rgba(26,26,94,0.15);border-right:none;border-radius:10px 0 0 10px;font-size:15px;outline:none;font-family:'Noto Sans TC','Inter',sans-serif;background:#fff}
.search-box input::placeholder{color:#94A3B8}
.search-box button{background:#FF6B9D;color:#fff;font-size:15px;font-weight:700;padding:14px 20px;border:none;border-radius:0 10px 10px 0;cursor:pointer;white-space:nowrap}
.hint{font-size:12px;color:#7B7B9E;text-align:center}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="hero">
    <div class="badge">🚀 品牌網域</div>
    <h1 class="hero-title">創立品牌，<br>從擁有<span>網域</span>開始</h1>

    <div class="bullet-section">
      <ul class="bullets">
        <li>✅ 自動設定，技術門檻歸零</li>
        <li>✅ 簡單介面，即時客服支援</li>
        <li>✅ 追蹤成效，行銷效益提高</li>
      </ul>
      <div class="person-illust">
        <div class="person-bg"></div>
        <div class="person">👩‍💻</div>
        <span class="float-icon">📊</span>
        <span class="float-icon">📈</span>
        <span class="float-icon">🎯</span>
        <span class="float-icon">💡</span>
        <div class="mini-tag tag-1">📈 +25%</div>
        <div class="mini-tag tag-2">🔗 短網址</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" placeholder="輸入你的品牌名稱">
      <button>搜尋網域</button>
    </div>
    <p class="hint">免費查詢，不需信用卡</p>
  </div>
</div>
</body>
</html>
