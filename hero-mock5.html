<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Mock 5 — 品牌短網址數據卡（精修版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Inter',sans-serif;color:#1E293B;line-height:1.5;background:#f5f5f5;display:flex;justify-content:center;padding:20px 0}
.phone-frame{width:390px;background:linear-gradient(160deg,#fff 50%,#FFF0F5 100%);min-height:100vh;position:relative;overflow:hidden}

.hero{padding:60px 20px 32px;position:relative}
.badge{display:inline-block;font-size:12px;font-weight:600;color:#FF6B9D;background:rgba(255,107,157,0.1);padding:4px 12px;border-radius:20px;margin-bottom:16px}
.hero-title{font-size:28px;line-height:38px;font-weight:700;color:#1A1A5E;margin-bottom:20px}
.hero-title span{color:#FF6B9D}

.bullet-section{display:grid;grid-template-columns:1fr 170px;gap:10px;align-items:start;margin-bottom:24px}
.bullets{list-style:none}
.bullets li{font-size:14px;color:#1A1A5E;margin-bottom:8px;font-weight:500;line-height:1.4}

/* 精修版 Dashboard 卡片 */
.dashboard-card{background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(26,26,94,0.13);border:1px solid rgba(26,26,94,0.06);overflow:hidden}
.dc-toolbar{background:#F1F3F5;padding:5px 10px;display:flex;align-items:center;gap:5px;border-bottom:1px solid #E5E7EB}
.dc-dots{display:flex;gap:4px}
.dc-dots span{width:6px;height:6px;border-radius:50%}
.dc-dots span:nth-child(1){background:#FF5F56}
.dc-dots span:nth-child(2){background:#FFBD2E}
.dc-dots span:nth-child(3){background:#27C93F}
.dc-url-bar{font-size:7px;color:#7B7B9E;margin-left:4px;background:#fff;padding:2px 6px;border-radius:3px;flex:1;font-family:'JetBrains Mono',monospace}
.dc-body{padding:8px}

/* 品牌短網址 */
.brand-url{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:#1A1A5E;background:#FFF0F5;padding:5px 8px;border-radius:5px;margin-bottom:6px;text-align:center;line-height:1.3}
.brand-url .pink{color:#FF6B9D}
.brand-url .lock{color:#22C55E;font-size:9px}

/* 三個指標 */
.dc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:5px}
.dc-stat{background:#FAFBFC;border-radius:4px;padding:4px 2px;text-align:center}
.dc-stat .num{font-size:11px;font-weight:700;font-family:'Inter',sans-serif;line-height:1.2}
.dc-stat .num.green{color:#22C55E}
.dc-stat .num.orange{color:#F5A623}
.dc-stat .num.pink{color:#FF6B9D}
.dc-stat .lbl{font-size:7px;color:#7B7B9E;line-height:1.2;margin-top:1px}

.dc-footer{font-size:7px;color:#7B7B9E;text-align:center;padding-top:4px;border-top:1px solid #F0F0F0}

.search-box{display:flex;gap:0;margin-bottom:12px}
.search-box input{flex:1;padding:14px 16px;border:2px solid rgba(26,26,94,0.15);border-right:none;border-radius:10px 0 0 10px;font-size:15px;outline:none;font-family:'Noto Sans TC','Inter',sans-serif;background:#fff}
.search-box input::placeholder{color:#94A3B8}
.search-box button{background:#FF6B9D;color:#fff;font-size:15px;font-weight:700;padding:14px 20px;border:none;border-radius:0 10px 10px 0;cursor:pointer;white-space:nowrap}
.hint{font-size:12px;color:#7B7B9E;text-align:center}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="hero">
    <div class="badge">🚀 品牌網域</div>
    <h1 class="hero-title">創立品牌，<br>從擁有<span>網域</span>開始</h1>

    <div class="bullet-section">
      <ul class="bullets">
        <li>✅ 自動設定，技術門檻歸零</li>
        <li>✅ 簡單介面，即時客服支援</li>
        <li>✅ 追蹤成效，行銷效益提高</li>
      </ul>
      <div class="dashboard-card">
        <div class="dc-toolbar">
          <div class="dc-dots"><span></span><span></span><span></span></div>
          <div class="dc-url-bar">🔒 yourbrand.com</div>
        </div>
        <div class="dc-body">
          <div class="brand-url">
            <span class="lock">🔒</span> <span class="pink">yourbrand.com</span>/新品上市
          </div>
          <div class="dc-stats">
            <div class="dc-stat">
              <div class="num green">+25%</div>
              <div class="lbl">點擊率</div>
            </div>
            <div class="dc-stat">
              <div class="num orange">35%</div>
              <div class="lbl">廣告費節省</div>
            </div>
            <div class="dc-stat">
              <div class="num pink">2×</div>
              <div class="lbl">測試效率</div>
            </div>
          </div>
          <div class="dc-footer">5,000+ 品牌使用 lihi</div>
        </div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" placeholder="輸入你的品牌名稱">
      <button>搜尋網域</button>
    </div>
    <p class="hint">免費查詢，不需信用卡</p>
  </div>
</div>
</body>
</html>
